name: E-EXAM V2 validation

on:
  push:
    branches:
      - feature/kost-eexam-v2-native
      - audit/backup-retention-enforcement-2026-09-01
    paths:
      - "platform-ops/kost-eexam-v2/**"
      - ".github/workflows/eexam-v2-validation.yml"
  pull_request:
    paths:
      - "platform-ops/kost-eexam-v2/**"
      - ".github/workflows/eexam-v2-validation.yml"

permissions:
  contents: read

concurrency:
  group: eexam-v2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint-type-unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-ops/kost-eexam-v2
    env:
      SESSION_SECRET: ci-only-session-secret-32-characters-minimum
      DB_PATH: ./data/ci-kost-eexam-v2.db
      BACKUP_DIR: ./data/ci-backups
      NODE_ENV: test
      EMAIL_MODE: log
      APP_BASE_URL: http://127.0.0.1:3000
      EMAIL_REPLY_TO: cbta@example.invalid
      EMAIL_DEFAULT_TIMEZONE: Africa/Algiers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm 9.15.9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build
